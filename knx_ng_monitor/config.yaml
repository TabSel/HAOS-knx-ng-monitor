name: "KNX-NG-Monitor"
version: "0.8.3.1"
description: "https://github.com/ingel81/knx-ng-monitor als HAOS App"
slug: "nx_ng_monitor"
url: "https://github.com/ingel81/knx-ng-monitor"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
hassio_api: false
homeassistant_api: false
host_network: true
ingress: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Web-UI (z.B. http://homeassistant:8080)"
map:
  - "data:rw"
options:
  log_level: "Information"
schema:
  log_level: "list(Verbose|Debug|Information|Warning|Error|Fatal)"
